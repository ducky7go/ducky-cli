name: Release Draft (hagi-release-drafter)

# Drafts the next stable release from Conventional Commits.
# Publishing the draft remains a manual step.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable X.Y.Z to use instead of the version derived from commits
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Draft release
        id: draft
        uses: HagiCode-org/hagi-release-drafter@v0.5.0
        with:
          version: ${{ inputs.version }}
          title-template: 'ducky-cli v{version}'
